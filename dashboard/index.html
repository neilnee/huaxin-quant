<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huaxin Quant 数据分析面板</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="state.css"><link rel="stylesheet" href="state-rules.css"><link rel="stylesheet" href="index-trend.css"><link rel="stylesheet" href="sector-detail.css">
</head>
<body>
  <main class="shell">
    <header class="page-header"><div><p class="eyebrow">HUAXIN QUANT · ANALYTICS DASHBOARD</p><h1>数据分析面板</h1></div><div class="header-meta"><label id="date-control">报告日期 <select id="date-select" aria-label="报告日期"></select></label><p id="data-status" class="data-status">—</p></div></header>
    <nav id="module-nav" class="module-nav" aria-label="分析模块"></nav>
    <p id="load-error" class="notice hidden"></p>
    <section id="module-placeholder" class="panel placeholder hidden"></section>
    <div id="market-content">
      <section class="panel state-panel"><div class="state-summary"><p class="section-label">当前市场状态</p><div class="state-title-row"><h2 id="market-state">—</h2><button id="state-help-toggle" class="state-help-toggle" type="button" aria-expanded="false" aria-controls="state-rules">详情</button></div><p id="state-duration" class="state-duration">—</p><div id="risk-tags" class="tags"></div></div><div class="state-reading"><p class="section-label">市场解读</p><p id="state-analysis" class="state-analysis">—</p><p id="state-transition" class="state-transition hidden">—</p></div></section>
      <section id="state-rules" class="panel state-rules hidden"></section>
      <section class="panel"><div class="table-scroll"><table id="index-table"></table></div></section>
      <section class="panel"><div class="section-heading"><div><p class="section-label">板块分布与延续性</p><h2>板块排名</h2></div><p>主排名：20日相对强度；点击行查看阶段证据</p></div><nav id="sector-tabs" class="tabs" aria-label="板块类别"></nav><div class="leaderboard-layout"><div class="table-scroll"><table id="sector-table"></table></div><aside id="sector-detail" class="sector-detail"></aside></div></section>
      <section class="panel"><div class="section-heading"><div><p class="section-label">阶段轨迹</p><h2>板块相对强度排名</h2></div><p>横轴为名次，纵轴为日期；最新日期在上</p></div><nav id="rank-window-tabs" class="tabs" aria-label="相对强度窗口"></nav><div class="table-scroll matrix-wrap"><table id="history-matrix"></table></div></section>
    </div>
  </main>
  <script src="data/market_context.js"></script><script src="app.js"></script>
</body>
</html>
